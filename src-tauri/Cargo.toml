[package]
name = "easy-notes"
version = "0.1.0"
description = "A simple analog notebook app"
authors = ["René Jesser"]
edition = "2021"

[lib]
name = "easy_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-handwriting = { path = "plugins/handwriting" }
# Path copy of 1.5.1: iOS was releasing the security-scoped folder before I/O.
tauri-plugin-scoped-storage = { path = "tauri-plugin-scoped-storage" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSError", "NSArray", "NSDictionary"] }
objc2-vision = { version = "0.3", features = [
	"VNRecognizeTextRequest",
	"VNRequestHandler",
	"VNRequest",
	"VNObservation",
	"VNTypes"
] }
